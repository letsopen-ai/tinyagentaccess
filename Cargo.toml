[workspace]
resolver = "2"
members = ["crates/*"]
[workspace.package]
version = "0.1.2"
edition = "2021"
rust-version = "1.88"
repository = "https://github.com/letsopen-ai/tinyagentaccess"
license = "MIT"
homepage = "https://github.com/letsopen-ai/tinyagentaccess#readme"
authors = ["Chen Nie <git@cnie.xyz>"]
description = "A local Rust MCP server for desktop capture, input, and tool forwarding."
keywords = ["mcp", "computer-use", "agent", "desktop"]
categories = ["command-line-utilities"]
publish = false
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal", "sync"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
subtle = "2"
getrandom = "0.3"
taa-platform = { path = "crates/taa-platform" }
taa-tools = { path = "crates/taa-tools" }
taa-mcp = { path = "crates/taa-mcp" }
