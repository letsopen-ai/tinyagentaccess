[workspace]
resolver = "2"
members = ["crates/*"]
[workspace.package]
version = "0.1.0-alpha.0"
edition = "2021"
rust-version = "1.88"
repository = "https://github.com/letsopen-ai/tinyagentaccess"
license = "MIT"
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal", "sync"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
taa-platform = { path = "crates/taa-platform" }
taa-tools = { path = "crates/taa-tools" }
taa-mcp = { path = "crates/taa-mcp" }
