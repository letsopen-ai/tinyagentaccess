bind = "127.0.0.1:8765"
[agent_access]
computer_vision = true
computer_input = true
forward_mcp_tools = false # accepted; milestone 4
screen_resolution = "1280x720" # or "native"
screen_image_format = "png" # png | jpeg; real capture in milestone 2
user_control_mode = "disabled" # view_only | view_stop | disabled; no-op in M1
[sessions]
max_sessions = 1
idle_timeout_secs = 780
[screenshots]
save_dir = "" # local disk placeholder; milestone 7
[platform]
linux_backend = "auto" # auto | wayland | x11; auto prefers Wayland, never XWayland
