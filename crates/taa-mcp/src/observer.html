<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Local desktop observer</title>
<style>body{font:16px system-ui;margin:2rem;background:#17212b;color:#fff}img{display:block;max-width:100%;margin-top:1rem}button,select{font:inherit;padding:.5rem}button{background:#b3261e;color:white}p{max-width:70ch}</style>
<h1>Local desktop observer</h1><p>TINY-PROPOSAL local substitute for viewing. Not AWS DCV. Unauthenticated: keep this server on loopback. Select a live MCP session. Stop ends that session after admitted desktop work completes; a new session is needed to resume.</p>
<label>Session <select id="sessions"></select></label> <!--STOP--><p id="status" role="status"></p><img id="screen" alt="Current desktop (shared by all local sessions)">
<script>
const sessions=document.getElementById('sessions'),status=document.getElementById('status'),screen=document.getElementById('screen'),stop=document.getElementById('stop');
async function poll(){try{const r=await fetch('/observe/sessions',{cache:'no-store'});if(!r.ok)throw Error('Observer unavailable');const data=await r.json(),old=sessions.value;sessions.replaceChildren(...data.sessions.map(id=>new Option(id,id)));if(data.sessions.includes(old))sessions.value=old;if(!sessions.value){screen.removeAttribute('src');status.textContent='No live session';return}const id=sessions.value;const image=await fetch('/observe/latest/'+encodeURIComponent(id),{cache:'no-store'});if(!image.ok)throw Error('Capture unavailable or session closed');const frame=await image.json(),block=frame.content?.find(b=>b.type==='image');if(!block)throw Error('Capture failed');screen.src='data:'+block.mimeType+';base64,'+block.data;status.textContent='Watching '+id}catch(e){status.textContent=e.message;screen.removeAttribute('src')}finally{setTimeout(poll,1500)}}
if(stop)stop.onclick=async()=>{if(!sessions.value)return;stop.disabled=true;try{const r=await fetch('/observe/stop/'+encodeURIComponent(sessions.value),{method:'POST'});status.textContent=r.ok?'Session stopped. Open a new MCP session to resume.':'Stop failed ('+r.status+')'}finally{stop.disabled=false}};poll();
</script></html>
