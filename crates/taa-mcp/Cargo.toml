[package]
name = "taa-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
homepage.workspace = true
authors.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[dependencies]
serde_json .workspace = true
tokio .workspace = true
axum .workspace = true
uuid .workspace = true
taa-tools .workspace = true
taa-platform .workspace = true

taa-forward = { path = "../taa-forward" }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[dev-dependencies.taa-platform]
workspace = true
features = ["test-support"]

# Reuse the portable Rust fixture for HTTP integration tests; no Python required.
[[bin]]
name = "taa-mcp-forward-fixture"
path = "../taa-forward/src/bin/taa-fake-mcp-server.rs"
