[package]
name = "taa-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[features]
test-support = ["dep:serde_json"]

[dependencies]
serde_json = { workspace = true, optional = true }
png = "0.17"
jpeg-encoder = { version = "0.6", default-features = false, features = ["std"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
x11rb = { version = "0.13", features = ["xtest", "randr", "xfixes"] }
ashpd = { version = "0.12", default-features = false, features = ["tokio"] }
tokio.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_Graphics_Gdi"] }

[dev-dependencies]
serde_json.workspace = true
jpeg-decoder = { version = "0.3", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "SCScreenshotManager", "SCShareableContent", "SCStream", "SCError", "objc2-core-graphics", "objc2-core-foundation"] }
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSError", "NSString"] }
block2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGImage"] }
