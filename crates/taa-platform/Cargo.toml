[package]
name = "taa-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[features]
test-support = ["dep:serde_json"]

[dependencies]
serde_json = { workspace = true, optional = true }
png = "0.17"
jpeg-encoder = { version = "0.6", default-features = false, features = ["std"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
x11rb = { version = "0.13", features = ["xtest", "randr", "xfixes"] }
ashpd = { version = "0.12", default-features = false, features = ["tokio"] }
tokio.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_Graphics_Gdi"] }

[dev-dependencies]
serde_json.workspace = true
jpeg-decoder = { version = "0.3", default-features = false }
