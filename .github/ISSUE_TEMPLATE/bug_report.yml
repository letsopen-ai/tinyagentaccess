name: Bug report
description: Report a reproducible problem with tinyAgentAccess.
body:
  - type: markdown
    attributes:
      value: "For security reports, follow [SECURITY.md](https://github.com/letsopen-ai/tinyagentaccess/blob/main/SECURITY.md). This server has no authentication; test on loopback. Remove credentials, serial numbers, private screen content, and personal paths."
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: OS and desktop environment
      description: Linux distribution and X11 or Wayland (GNOME/KDE), macOS version, or Windows version; include relevant permission state.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Minimal config, logs, or screenshots with secrets and identifying information removed.
